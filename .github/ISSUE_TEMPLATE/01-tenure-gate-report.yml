name: "① 시나리오 게이트 실측 보고"
description: "시나리오 게이트 판정이 실제로 맞았는지 알려주세요. 이 프로젝트에서 가장 필요한 기여입니다."
title: "[게이트] "
labels: ["field-report", "verification", "tenure-gate"]
body:
  - type: markdown
    attributes:
      value: |
        `safe_ratio: 0.6`(필요 지평 계산)은 **경험칙이지 검증된 값이 아닙니다.**
        시나리오 구성 방식도 마찬가지입니다.
        쓰고 나서 결과를 알려주시면 그게 이 프로젝트에서 제일 값진 기여입니다.

        > **틀렸다는 보고가 맞았다는 보고보다 값집니다.** 조건을 좁힐 수 있게 해 주기 때문입니다.

        회사가 특정되지 않게 써 주세요. **숫자 대신 관계로** 적으면 대개 해결됩니다.
        (`매출 ○,○○○억` → `매출 수천억대`)

  - type: dropdown
    id: outcome
    attributes:
      label: 결과
      description: 게이트 판정과 실제가 맞았나요?
      options:
        - "맞았다 — 전 시나리오 성립 안건이 실제로 진행됐다"
        - "맞았다 — 인물 의존·조건부 안건이 실제로 흔들렸다"
        - "틀렸다 — 전 시나리오 성립인데 착수가 안 됐다"
        - "틀렸다 — 인물 의존 판정인데 잘만 진행됐다"
        - "시나리오에 없던 전환이 실제로 일어났다"
        - "확인 못 함"
    validations:
      required: true

  - type: textarea
    id: conditions
    attributes:
      label: 조건
      description: 게이트가 작동한 환경. 회사를 특정하지 않는 선에서.
      placeholder: |
        소유구조: 전문 경영 / 오너 경영 / PE 보유 / 상장사
        산업 범주: (넓게)
        규모대: (넓게)
        만든 시나리오: 예) 현 체제 · 전략 전환 · 담당 교체
    validations:
      required: true

  - type: textarea
    id: calculation
    attributes:
      label: 계산과 판정
      placeholder: |
        추정 회수 기간: O년
        필요 지평 (회수 ÷ 0.6): O년
        판정: 전 시나리오 성립 / 조건부 성립 (어느 시나리오에서 죽는지) / 인물 의존
        안건의 논거: 한 줄 (경제 구조였나, 사람 사정이었나)
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제로 일어난 일
      validations:
        required: true

  - type: textarea
    id: cause
    attributes:
      label: 어긋났다면 추정 원인
      description: 틀린 이유가 맞은 이유보다 정보량이 큽니다.
      placeholder: |
        예) 논거는 성립했는데 예산 시즌이 지나 있었다.
            시나리오 재료에 예산 주기도 넣어야 할 듯.

  - type: input
    id: proposal
    attributes:
      label: 조정 제안
      description: safe_ratio 값이나 시나리오 구성을 바꿔야 한다고 보시면 근거와 함께.
      placeholder: "시나리오에 '예산 동결'을 기본으로 넣어야 했다"

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: "이 글만 보고 어느 회사인지 좁혀지지 않는다"
          required: true
        - label: "정확한 수치 대신 관계나 범위로 적었다"
          required: true
        - label: "특정 개인의 신상·평판이 들어 있지 않다"
          required: true
