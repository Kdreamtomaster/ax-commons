name: "③ 모델 실측 보고"
description: "어떤 모델이 이 도구의 규칙을 지켰는지 / 못 지켰는지 알려주세요."
title: "[모델] "
labels: ["field-report", "verification", "models"]
body:
  - type: markdown
    attributes:
      value: |
        `dist/local-models/README.md` 의 크기별 성능표는 **추정이지 실측이 아닙니다.**
        "7~9B는 등급 표기를 흘린다" 같은 문장도 검증되지 않았습니다.

        규칙을 지켰는지가 핵심입니다. 답변 품질이 아니라 **절차 준수**를 봅니다.

  - type: input
    id: model
    attributes:
      label: 모델
      placeholder: "Qwen3 30B-A3B / Gemma 3 27B / EXAONE 32B / Hermes 4 14B ..."
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: 실행 환경
      placeholder: "Ollama q4_K_M / vLLM FP8 / LM Studio / OpenRouter"
    validations:
      required: true

  - type: input
    id: settings
    attributes:
      label: 설정
      placeholder: "temperature 0.3, num_ctx 32768, max_tokens 4096"
    validations:
      required: true

  - type: dropdown
    id: prompt
    attributes:
      label: 쓴 프롬프트
      options:
        - "system-prompt-full.md"
        - "system-prompt-compact.md"
        - "스킬 형태 (SKILL.md)"
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: 규칙 준수 — 지킨 것에 체크
      description: 안 지킨 항목을 비워 두는 것이 이 보고의 핵심입니다.
      options:
        - label: "근거 등급([사실]/[추론]/[가설]/[모름])을 문장마다 붙였다"
        - label: "[가설]에 반증 조건을 달았다"
        - label: "뻔한 답을 먼저 적고 버렸다"
        - label: "질문을 한 라운드에 4개 이하로 했다"
        - label: "R1에서 초안을 먼저 냈다 (질문만 늘어놓지 않았다)"
        - label: "[불가] 판정을 하나 이상 남겼다"
        - label: "'남은 모름'을 비우지 않았다"
        - label: "반박 안내를 썼다"
        - label: "임기 게이트를 계산했다"
        - label: "표 형식이 깨지지 않았다"

  - type: textarea
    id: failure
    attributes:
      label: 어디서 무너졌나
      description: 대화가 길어지면서 잊었는지, 처음부터 무시했는지 구분해 주시면 특히 좋습니다.
      placeholder: |
        예) 처음 3턴은 등급을 붙였는데 그 뒤로 사라졌다. 문맥 8k 넘어가면서.
    validations:
      required: true

  - type: input
    id: verdict
    attributes:
      label: 한 줄 판정
      placeholder: "실무에 쓸 만하다 / compact로만 쓸 만하다 / 못 쓴다"
    validations:
      required: true

  - type: input
    id: lang
    attributes:
      label: 한국어 품질
      description: 국산 모델이 아니면 특히 궁금합니다.
      placeholder: "자연스럽다 / 번역투가 있다 / 어색해서 못 쓰겠다 / 영어로만 썼다"
